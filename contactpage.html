<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>

<style>

body{
    margin:0;
    background:black;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:450px;
    background:#111827;
    padding:30px;
    border-radius:10px;
    border:1px solid purple;
}

h1{
    color:#8B5CF6;
    text-align:center;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:6px;
    border:none;
    outline:none;
    box-sizing:border-box;
}

textarea{
    height:120px;
    resize:none;
}

button{
    width:100%;
    padding:12px;
    background:#8B5CF6;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#a67cff;
}

#message{
    color:lightgreen;
    text-align:center;
    margin-top:15px;
    display:none;
}

</style>
</head>
<body>
<div class="container">
<h1>Contact Me</h1>
<form id="contactForm">
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea placeholder="Your Message" required></textarea>
<button type="submit">Send Message</button>
</form>
<p id="message">✅ Message Sent Successfully!</p>
</div>
<script>
document.getElementById("contactForm").addEventListener("submit",function(e){e.preventDefault();
    document.getElementById("message").style.display="block";
    setTimeout(function(){
        window.location.href="portfolio1.html";
    },1000);
});

</script>

</body>
</html>
